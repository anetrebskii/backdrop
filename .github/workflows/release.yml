name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Check signing secrets
        env:
          HAS_P12: ${{ secrets.DEVELOPER_ID_P12 != '' }}
          HAS_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
        run: |
          if [ "$HAS_P12" != "true" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Missing secrets. Required: DEVELOPER_ID_P12, DEVELOPER_ID_P12_PASSWORD, ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID."
            exit 1
          fi

      - name: Set version
        run: |
          echo "VERSION=0.1.$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "BUILD=$((BUILD_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Install signing certificate, profile and API key
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/devid.p12" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

          PROFILES="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILES"
          UUID=$(security cms -D -i signing/Backdrop_Developer_ID.provisionprofile | plutil -extract UUID raw -)
          cp signing/Backdrop_Developer_ID.provisionprofile "$PROFILES/$UUID.provisionprofile"

          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Build
        run: |
          brew install xcodegen
          xcodebuild -version
          xcodegen generate
          xcodebuild -project Backdrop.xcodeproj -scheme Backdrop -configuration Release \
            -derivedDataPath build MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" build
          codesign --verify --deep --strict build/Build/Products/Release/Backdrop.app

      - name: Notarize
        run: |
          APP=build/Build/Products/Release/Backdrop.app
          ditto -c -k --keepParent "$APP" build/notarize.zip
          xcrun notarytool submit build/notarize.zip \
            --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --output-format json > build/notary.json
          cat build/notary.json
          if [ "$(plutil -extract status raw build/notary.json)" != "Accepted" ]; then
            xcrun notarytool log "$(plutil -extract id raw build/notary.json)" \
              --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose "$APP"
          ditto -c -k --keepParent "$APP" "build/Backdrop-$VERSION.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "build/Backdrop-$VERSION.zip" \
            --title "Backdrop $VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
